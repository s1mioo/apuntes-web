<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Apuntes de Estudio</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Barra lateral simplificada -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>📚 Mis Apuntes</h2>
        </div>
        
        <!-- Botón Home Principal -->
        <button id="btn-home" class="home-btn">🏠 Inicio</button>
        
        <hr class="divider">
        
        <!-- Lista de ramos (sin desplegar los archivos) -->
        <h3>Asignaturas</h3>
        <ul class="subject-list">
            <li class="subject-item" onclick="cargarRamo('inf221')">INF221 - Algoritmos</li>
            <li class="subject-item" onclick="cargarRamo('inf236')">INF236 - ADS</li>
        </ul>
    </aside>

    <!-- Área principal -->
    <main class="content-area">
        
        <!-- VISTA HOME (Tarjetas principales) -->
        <div id="home-view" class="home-container">
            <h1>Bienvenido a tus apuntes</h1>
            <p>Selecciona una asignatura para comenzar a estudiar.</p>
            
            <div class="grid-ramos">
                <button class="ramo-card" onclick="cargarRamo('inf221')">
                    <h3>INF221</h3>
                    <p>Algoritmos y Complejidad</p>
                </button>
                <button class="ramo-card" onclick="cargarRamo('inf236')">
                    <h3>INF236</h3>
                    <p>Análisis y Diseño de Software</p>
                </button>
            </div>
        </div>

        <!-- VISTA DE APUNTES (Oculta al inicio) -->
        <div id="apuntes-view" style="display: none;">
            <div class="apuntes-header">
                <h2 id="titulo-ramo">Título del Ramo</h2>
                <!-- Aquí aparecerán dinámicamente los botones de los HTMLs de cada ramo -->
                <div id="lista-archivos-ramo" class="botones-archivos"></div>
            </div>
            
            <div class="iframe-container">
                <iframe id="visor-html" src="" frameborder="0"></iframe>
            </div>
        </div>
        
    </main>

    <script src="assets/js/script.js"></script>
</body>
</html>
