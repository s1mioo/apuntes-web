<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apuntes — Panel de estudio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app">

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1 class="sidebar-title">Apuntes</h1>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Cambiar tema" title="Cambiar tema">
        <svg id="iconSun" class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path>
        </svg>
        <svg id="iconMoon" class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" hidden>
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"></path>
        </svg>
      </button>
    </div>

    <p class="sidebar-hint">Asignaturas y apuntes</p>

    <nav class="subject-list" id="subjectList" aria-label="Índice de asignaturas"></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle" type="button" aria-label="Abrir índice">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 6h18M3 12h18M3 18h18"></path>
        </svg>
      </button>
      <span class="topbar-current" id="topbarCurrent">Elige un apunte</span>
    </header>

    <div class="content">
      <div class="welcome" id="welcome">
        <h2>Panel de apuntes</h2>
        <p>Selecciona una asignatura en el panel lateral y luego un apunte para visualizarlo aquí.</p>
        <p class="welcome-sub">El contenido se carga sin recargar la página ni perder la navegación.</p>
      </div>
      <iframe id="noteFrame" class="note-frame" title="Contenido del apunte" hidden></iframe>
    </div>
  </div>

</div>

<script src="assets/js/script.js"></script>
</body>
</html>
