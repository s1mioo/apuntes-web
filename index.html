<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Apuntes Universitarios</title>
    <!-- Importamos una fuente moderna para mejorar la estética -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- Barra Lateral -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>📚 Mis Apuntes</h2>
        </div>
        
        <button id="btn-home" class="btn-home">
            🏠 Volver al Inicio
        </button>
        
        <div class="sidebar-menu">
            <h3>ASIGNATURAS</h3>
            <!-- Se llena desde js/ramos.js -->
            <ul id="lista-ramos" class="subject-list"></ul>
        </div>
    </aside>

    <!-- Área de Contenido Principal -->
    <main class="content">
        
        <!-- Vista de Inicio (Home) -->
        <section id="home-view" class="view-section active">
            <header class="home-header">
                <h1>Bienvenido a tu área de estudio</h1>
                <p>Selecciona una asignatura para acceder a tus resúmenes y apuntes en HTML.</p>
            </header>
            
            <!-- Se llena desde js/ramos.js -->
            <div id="grid-ramos" class="grid-ramos"></div>
        </section>

        <!-- Vista del Visor de Apuntes -->
        <section id="apuntes-view" class="view-section">
            <header class="apuntes-header">
                <h2 id="titulo-ramo">Título del Ramo</h2>
                <div id="lista-archivos-ramo" class="file-buttons"></div>
            </header>
            
            <div class="iframe-wrapper">
                <iframe id="visor-html" src="" title="Visor de apuntes"></iframe>
            </div>
        </section>
        
    </main>

    <script src="js/ramos.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
